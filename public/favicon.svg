<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ocean" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#3fa7f0"/>
      <stop offset="0.55" stop-color="#1557a8"/>
      <stop offset="1" stop-color="#0a2552"/>
    </radialGradient>
    <linearGradient id="night" x1="0.2" y1="0.15" x2="0.95" y2="0.9">
      <stop offset="0.45" stop-color="#02040a" stop-opacity="0"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.82" stop-color="#55ddff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#55ddff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="64" cy="64" r="34"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="rotate(-20 64 64)">
    <!-- far side of the orbit, behind the Earth -->
    <path d="M10 64 A54 17 0 0 1 118 64" fill="none" stroke="#55ddff" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>

  <circle cx="64" cy="64" r="39" fill="url(#halo)"/>
  <circle cx="64" cy="64" r="34" fill="url(#ocean)"/>
  <g clip-path="url(#globe)" fill="#4fb36b">
    <path d="M40 40c6-6 15-8 20-5 4 3 1 8-4 10-3 1-3 5 1 8 3 3 1 8-4 9-6 1-9 6-12 9-3-5-5-12-5-18 0-5 1-9 4-13z"/>
    <path d="M70 34c7-2 15 1 20 7 3 4 1 8-4 8-4 0-6 3-4 7 2 5 0 11-5 14-4 2-6 7-9 10-2-6-1-12 1-17 1-4-2-7-5-9-4-3-3-8 1-11 1-4 2-7 5-9z"/>
    <path d="M58 86c4-2 9-1 11 2 2 3-1 7-5 8-4 1-8-1-9-4 0-3 1-5 3-6z"/>
  </g>
  <circle cx="64" cy="64" r="34" fill="url(#night)"/>

  <g transform="rotate(-20 64 64)">
    <!-- near side of the orbit, in front of the Earth -->
    <path d="M118 64 A54 17 0 0 1 10 64" fill="none" stroke="#55ddff" stroke-width="2.5" filter="url(#glow)"/>
    <!-- ISS -->
    <g transform="translate(108 73) rotate(12)" filter="url(#glow)">
      <rect x="-10" y="-1" width="20" height="2" rx="1" fill="#b8c5cc"/>
      <rect x="-11" y="-8" width="5" height="16" rx="1" fill="#2b6da8" stroke="#8fd3ff" stroke-width="0.8"/>
      <rect x="6" y="-8" width="5" height="16" rx="1" fill="#2b6da8" stroke="#8fd3ff" stroke-width="0.8"/>
      <rect x="-3.5" y="-3" width="7" height="6" rx="1.5" fill="#e8f1f5"/>
    </g>
  </g>
</svg>
